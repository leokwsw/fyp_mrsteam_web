steps:
  # 構建 Docker 映像
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/fyp-mrsteam-web:$BUILD_ID',
      '-t', 'gcr.io/$PROJECT_ID/fyp-mrsteam-web:latest',
      '.'
    ]

  # 推送映像到 Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/fyp-mrsteam-web:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/fyp-mrsteam-web:latest']

  # 部署到 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'fyp-mrsteam-web',
      '--image', 'gcr.io/$PROJECT_ID/fyp-mrsteam-web:latest',
      '--region', 'asia-east1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '8080',
      '--memory', '512Mi',
      '--cpu', '1',
      '--max-instances', '10',
      '--min-instances', '0'
    ]

# 設置映像推送到 Container Registry
images:
  - 'gcr.io/$PROJECT_ID/fyp-mrsteam-web:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/fyp-mrsteam-web:latest'

# 構建選項
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# 超時設置（20分鐘）
timeout: '1200s'
